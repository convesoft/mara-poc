name: Scale fixture verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-scale-v01-fixture:
    name: Verify scale-v0.1 fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check qualification resource preconditions
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(pwd -P)"
          tmp_root="$(CDPATH= cd -- /tmp && pwd -P)"
          runner_temp_parent="$(CDPATH= cd -- "$RUNNER_TEMP" && pwd -P)"
          tmp_usage="$(sudo -n du -sk "$tmp_root")"
          tmp_used_kib="$(printf '%s\n' "$tmp_usage" | awk 'NR == 1 { print $1 }')"
          runner_temp_df="$(df -Pk "$runner_temp_parent")"
          total_kib="$(printf '%s\n' "$runner_temp_df" | awk 'NR == 2 { print $2 }')"
          available_kib="$(printf '%s\n' "$runner_temp_df" | awk 'NR == 2 { print $4 }')"
          {
            printf 'tmp_root=%s\n' "$tmp_root"
            printf 'tmp_used_kib=%s\n' "$tmp_used_kib"
            printf 'runner_temp_parent=%s\n' "$runner_temp_parent"
            printf 'runner_temp_total_kib=%s\n' "$total_kib"
            printf 'runner_temp_available_kib=%s\n' "$available_kib"
            df -h "$tmp_root" "$repo_root"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$tmp_used_kib"
          test "$tmp_used_kib" -le 1048576
          test -n "$total_kib"
          test -n "$available_kib"
          test "$available_kib" -ge 2097152
          case "$RUNNER_OS" in
            Linux) filesystem_type="$(stat -f -c %T "$runner_temp_parent")" ;;
            macOS)
              filesystem_device="$(printf '%s\n' "$runner_temp_df" | /usr/bin/awk 'NR == 2 { print $1 }')"
              test -n "$filesystem_device"
              filesystem_type="$(/usr/sbin/diskutil info "$filesystem_device" | /usr/bin/awk -F ': *' '/^[[:space:]]*File System Personality:/ { print tolower($2); exit }')"
              ;;
            *) printf 'unsupported native runner: %s\n' "$RUNNER_OS" >&2; exit 1 ;;
          esac
          test -n "$filesystem_type"
          printf 'runner_temp_filesystem_type=%s\n' "$filesystem_type" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$filesystem_type" in
            tmpfs|ramfs) printf 'volatile runner storage: %s\n' "$filesystem_type" >&2; exit 1 ;;
          esac
      - name: Build bounded qualification tools
        run: |
          cargo build --locked -p mara-xtask
          cargo build --locked --release --bin mara
      - name: Generate, recompute, and independently verify the fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mara-scale-v01-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RUNNER_OS"
          test ! -e "$root"
          test ! -L "$root"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"

          env -u CARGO_TARGET_DIR target/debug/mara-xtask qualification generate-scale-v01 \
            --qualification-root "$root"

          tests/qualification/verify-scale-v01.sh --qualification-root "$root"
      - name: Record resource gates before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='${{ steps.fixture.outputs.root }}'
          test -n "$root"
          test -d "$root"
          test ! -L "$root"
          evidence="$root/evidence"
          test -d "$evidence"
          test ! -L "$evidence"
          runner_properties="$evidence/runner-properties.txt"
          test ! -e "$runner_properties"
          test ! -L "$runner_properties"
          repo_root="$(pwd -P)"
          tmp_root="$(CDPATH= cd -- /tmp && pwd -P)"
          runner_temp_parent="$(CDPATH= cd -- "$RUNNER_TEMP" && pwd -P)"
          tmp_usage="$(sudo -n du -sk "$tmp_root")"
          tmp_used_kib="$(printf '%s\n' "$tmp_usage" | awk 'NR == 1 { print $1 }')"
          root_usage="$(du -sk "$root")"
          root_used_kib="$(printf '%s\n' "$root_usage" | awk 'NR == 1 { print $1 }')"
          runner_temp_df="$(df -Pk "$runner_temp_parent")"
          total_kib="$(printf '%s\n' "$runner_temp_df" | awk 'NR == 2 { print $2 }')"
          available_kib="$(printf '%s\n' "$runner_temp_df" | awk 'NR == 2 { print $4 }')"
          case "$RUNNER_OS" in
            Linux) filesystem_type="$(stat -f -c %T "$runner_temp_parent")" ;;
            macOS)
              filesystem_device="$(printf '%s\n' "$runner_temp_df" | /usr/bin/awk 'NR == 2 { print $1 }')"
              test -n "$filesystem_device"
              filesystem_type="$(/usr/sbin/diskutil info "$filesystem_device" | /usr/bin/awk -F ': *' '/^[[:space:]]*File System Personality:/ { print tolower($2); exit }')"
              ;;
            *) printf 'unsupported native runner: %s\n' "$RUNNER_OS" >&2; exit 1 ;;
          esac
          native_sha256() {
            case "$RUNNER_OS" in
              Linux) sha256sum <"$1" | awk 'NR == 1 { print $1 }' ;;
              macOS) shasum -a 256 <"$1" | awk 'NR == 1 { print $1 }' ;;
            esac
          }
          source_commit="$(git rev-parse HEAD)"
          xtask_sha256="$(native_sha256 target/debug/mara-xtask)"
          mara_sha256="$(native_sha256 target/release/mara)"
          manifest_sha256="$(native_sha256 tests/qualification/scale-v01.SHA256SUMS)"
          verifier_sha256="$(native_sha256 tests/qualification/verify-scale-v01.sh)"
          {
            printf 'workflow_uri=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'workflow_identifier=%s/%s/%s/%s\n' "$GITHUB_WORKFLOW" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'xtask_sha256=%s\n' "$xtask_sha256"
            printf 'mara_sha256=%s\n' "$mara_sha256"
            printf 'manifest_sha256=%s\n' "$manifest_sha256"
            printf 'verifier_sha256=%s\n' "$verifier_sha256"
            printf 'source_repo=%s\n' "$repo_root"
            printf 'qualification_root=%s\n' "$root"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_image=%s\n' "${ImageOS:-}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-}"
            printf '%s\n' 'uname_begin'
            uname -a
            printf '%s\n' 'uname_end' 'rustc_begin'
            rustc --version --verbose
            printf '%s\n' 'rustc_end' 'cargo_begin'
            cargo --version --verbose
            printf '%s\n' 'cargo_end'
            case "$RUNNER_OS" in
              Linux)
                printf '%s\n' 'lscpu_begin'
                lscpu
                printf '%s\n' 'lscpu_end' 'free_bytes_begin'
                free -b
                printf '%s\n' 'free_bytes_end'
                ;;
              macOS)
                printf '%s\n' 'sw_vers_begin'
                sw_vers
                printf '%s\n' 'sw_vers_end'
                printf 'hw_logicalcpu=%s\n' "$(sysctl -n hw.logicalcpu)"
                printf 'hw_memsize=%s\n' "$(sysctl -n hw.memsize)"
                ;;
            esac
          } > "$runner_properties"
          {
            printf 'tmp_root=%s\n' "$tmp_root"
            printf 'tmp_used_kib=%s\n' "$tmp_used_kib"
            printf 'qualification_root=%s\n' "$root"
            printf 'qualification_root_used_kib=%s\n' "$root_used_kib"
            printf 'runner_temp_parent=%s\n' "$runner_temp_parent"
            printf 'runner_temp_total_kib=%s\n' "$total_kib"
            printf 'runner_temp_available_kib=%s\n' "$available_kib"
            printf 'runner_temp_filesystem_type=%s\n' "$filesystem_type"
            df -h "$tmp_root" "$repo_root" "$root"
          } > "$evidence/resource-before-cleanup.txt"
          test -n "$tmp_used_kib"
          test "$tmp_used_kib" -le 1048576
          test -n "$root_used_kib"
          test -n "$available_kib"
          test "$available_kib" -ge 2097152
          test -n "$filesystem_type"
          case "$filesystem_type" in
            tmpfs|ramfs) printf 'volatile runner storage: %s\n' "$filesystem_type" >&2; exit 1 ;;
          esac
      - name: Upload fixture-verification evidence
        if: always() && steps.fixture.outputs.root != ''
        uses: actions/upload-artifact@v4
        with:
          name: scale-v01-fixture-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ steps.fixture.outputs.root }}/evidence
      - name: Remove disposable external workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='${{ steps.fixture.outputs.root }}'
          repo_root="$(pwd -P)"
          tmp_root="$(CDPATH= cd -- /tmp && pwd -P)"
          cleanup_failed=0
          if [ -n "$root" ] && { [ -e "$root" ] || [ -L "$root" ]; }; then
            if ! rm -rf -- "$root"; then
              printf 'qualification root cleanup command failed: %s\n' "$root" >&2
              cleanup_failed=1
            fi
          fi
          if [ -n "$root" ] && { [ -e "$root" ] || [ -L "$root" ]; }; then
            printf 'qualification root remained after cleanup: %s\n' "$root" >&2
            cleanup_failed=1
          fi
          post_resource_failed=0
          if ! post_cleanup_tmp_usage="$(sudo -n du -sk "$tmp_root")"; then
            printf '%s\n' 'post-cleanup /tmp usage observation failed' >&2
            post_cleanup_tmp_usage=
            post_resource_failed=1
          fi
          post_cleanup_tmp_used_kib="$(printf '%s\n' "$post_cleanup_tmp_usage" | awk 'NR == 1 { print $1 }')"
          if [ -z "$post_cleanup_tmp_used_kib" ]; then
            post_resource_failed=1
          fi
          printf 'post_cleanup_tmp_used_kib=%s\n' "$post_cleanup_tmp_used_kib"
          if ! df -h "$tmp_root" "$repo_root"; then
            post_resource_failed=1
          fi
          if [ "$cleanup_failed" -ne 0 ] || [ "$post_resource_failed" -ne 0 ]; then
            exit 1
          fi
